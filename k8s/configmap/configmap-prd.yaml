apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: repairshop
  labels:
    app: notification-service
    env: prd
data:
  SPRING_APPLICATION_NAME: notification-service
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: prd
  SPRING_MAIL_HOST: mailpit
  SPRING_MAIL_PORT: "1025"
  AWS_REGION: us-east-1
  SQS_QUEUE_APPROVE_NOTIFICATION: approve-notification-queue-prd
  SQS_QUEUE_CALLBACK_APPROVE: callback-approve-notification-queue-prd
  SQS_QUEUE_PAYMENT_NOTIFICATION: payment-notification-queue-prd
  SQS_HEALTH_CHECK_ENABLED: "true"
  SQS_HEALTH_CHECK_MAX_IDLE: "120"
  LOGGING_LEVEL_COM_CAO_REPAIRSHOP_NOTIFICATION: INFO
