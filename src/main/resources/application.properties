spring.application.name=notification-service
server.port=${SERVER_PORT:8080}

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Server / Reverse Proxy Forward Headers (API Gateway / NLB)
server.forward-headers-strategy=framework

# Logging Pattern (W3C OpenTelemetry Correlation)
logging.pattern.level=%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]

# AWS Settings
aws.region=${AWS_REGION:us-east-1}

# SQS Queues - Fase 4 Oficiais (tech-challenge-repairshop-infra-sqs)
sqs.queue.approve-notification=${SQS_QUEUE_APPROVE_NOTIFICATION:approve-notification-queue-dev}
sqs.queue.callback-approve=${SQS_QUEUE_CALLBACK_APPROVE:callback-approve-notification-queue-dev}
sqs.queue.payment-notification=${SQS_QUEUE_PAYMENT_NOTIFICATION:payment-notification-queue-dev}

# SMTP / Mailpit (Emulador no EKS namespace 'repairshop' ou local)
spring.mail.host=${SPRING_MAIL_HOST:mailpit}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Actuator & Probes K8s (PF-11)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true

# Readiness Probe Group
management.endpoint.health.group.readiness.include=readinessState

# Liveness Probe Group (Self-Healing para SQS Listeners)
management.endpoint.health.group.liveness.include=livenessState,sqsListener

# SQS Health Check Parameters
notification.sqs.health-check.enabled=${SQS_HEALTH_CHECK_ENABLED:true}
notification.sqs.health-check.max-idle-seconds=${SQS_HEALTH_CHECK_MAX_IDLE:120}

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
